<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>牛肉麵攤營業中・拼音後測</title>
<style>
:root{
  --bg:#fbf4e8; --card:#fffdf8; --ink:#3a2a1e; --sub:#8a7560; --line:#e6d8c3;
  --main:#c8462b; --main-d:#a33820; --ok:#2e8b57; --ok-bg:#e3f4ea; --bad:#c0392b; --bad-bg:#fbe5e1; --sel:#fff0c9;
}
body.boss{--bg:#2a1a2e; --card:#3a2540; --ink:#fff4d6; --sub:#cdb88a; --line:#5a4263; --main:#e0a526; --main-d:#a9780f; --ok:#6fd49a; --ok-bg:#1f4a36; --bad:#ff7a6b; --bad-bg:#5a2a2a; --sel:#5a4a2a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:"GenSenRounded TW","源泉圓體 TW","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:14px 16px 20px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;color:var(--sub);font-size:14px;min-height:24px;gap:8px}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.now{background:var(--main)} .dots i.ok{background:var(--ok)} .dots i.bad{background:var(--bad)}
.tag{display:inline-block;margin:12px 0 0;padding:2px 10px;border-radius:999px;background:var(--main);color:#fff;font-size:13px;font-weight:700}
body.boss .tag{color:#2a1a2e}
.stem{font-size:21px;line-height:1.5;font-weight:700;margin:8px 0 12px}
.opts{display:grid;gap:9px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt{font:inherit;font-size:18px;text-align:left;padding:11px 16px;min-height:48px;border-radius:14px;
  background:var(--card);color:var(--ink);border:2px solid var(--line);cursor:pointer}
.opt:disabled,.seg button:disabled,.chip:disabled{cursor:default}
.opt.sel{background:var(--sel);border-color:var(--main)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);font-weight:700}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;border-radius:14px;
  background:var(--card);border:2px solid var(--line)}
.row.ok{border-color:var(--ok);background:var(--ok-bg)} .row.bad{border-color:var(--bad);background:var(--bad-bg)}
.row span{font-size:17px;font-weight:700;flex:1}
.row select{font:inherit;font-size:16px;max-width:55%;padding:8px 6px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.seg button.sel{background:var(--sel);border-color:var(--main);font-weight:700}
.slots{min-height:54px;display:flex;flex-wrap:wrap;gap:8px;padding:8px;border-radius:14px;border:2px dashed var(--line);margin-bottom:10px;align-items:center}
.slots.ok{border-color:var(--ok);border-style:solid;background:var(--ok-bg)} .slots.bad{border-color:var(--bad);border-style:solid;background:var(--bad-bg)}
.slots small{color:var(--sub);font-size:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:20px;font-weight:700;min-width:48px;min-height:46px;padding:6px 14px;border-radius:12px;
  background:var(--card);color:var(--ink);border:2px solid var(--line);cursor:pointer}
.slots .chip{background:var(--sel);border-color:var(--main)}
.act{margin-top:12px}
.fb{margin-top:12px;padding-top:10px;border-top:2px dashed var(--line)}
.verdict{font-size:20px;font-weight:700;margin:0 0 4px}
.verdict.ok{color:var(--ok)} .verdict.bad{color:var(--bad)}
.why{font-size:15px;line-height:1.5;margin:0 0 4px}
.ans{font-size:15px;margin:0 0 4px;font-weight:700}
.src{font-size:14px;color:var(--sub);margin:0 0 10px}
.src a{color:var(--main-d);font-weight:700} body.boss .src a{color:var(--main)}
.btn{font:inherit;font-size:19px;font-weight:700;width:100%;padding:13px;border-radius:14px;border:0;
  background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main-d);cursor:pointer}
body.boss .btn{color:#2a1a2e}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn:not(:disabled):active{transform:translateY(2px);box-shadow:0 2px 0 var(--main-d)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:12px}
.center h1{font-size:28px;margin:0}
.center p{margin:0;font-size:16px;line-height:1.6;color:var(--sub)}
.lv{display:grid;gap:10px;text-align:left;margin-top:4px}
.lv button{font:inherit;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;
  padding:13px 16px;border-radius:14px;background:var(--card);color:var(--ink);border:2px solid var(--line);cursor:pointer}
.lv b{font-size:18px} .lv small{display:block;font-size:13px;color:var(--sub);font-weight:400;margin-top:2px}
.lv em{font-style:normal;font-size:13px;color:var(--ok);white-space:nowrap}
.lv .bossbtn{background:#2a1a2e;color:#fff4d6;border-color:#e0a526;box-shadow:0 4px 0 #a9780f;padding:16px}
.lv .bossbtn small{color:#cdb88a} .lv .bossbtn em{color:#e0a526}
.center p{text-wrap:balance}
.who{display:grid;gap:8px}
.who .small{font-size:14px} .hint{color:var(--bad);font-size:14px;min-height:1px}
.sid{font:inherit;font-size:18px;text-align:center;text-align-last:center;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.sid::placeholder{color:var(--sub);font-size:15px}
.sendmsg{font-size:15px;color:var(--sub)} .sendmsg.ok{color:var(--ok);font-weight:700}
.mini{font:inherit;font-size:14px;padding:4px 10px;border-radius:8px;border:2px solid var(--main);background:transparent;color:var(--main);cursor:pointer}
.score{font-size:60px;font-weight:800;color:var(--main);line-height:1}
.review{text-align:left;display:grid;gap:8px}
.review div{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.5}
.review b{color:var(--ok)}
.review a{color:var(--main-d);font-weight:700} body.boss .review a{color:var(--main)}
@media (max-height:640px){
  .tag{margin-top:8px}
  .stem{font-size:18px;margin:6px 0 8px}
  .opt{font-size:16px;padding:8px 14px;min-height:40px}
  .opts{gap:6px}
  .row{padding:5px 10px} .row span{font-size:16px}
  .chip{min-height:40px;font-size:18px}
  .why{font-size:14px}
  .fb{margin-top:8px;padding-top:8px}
  .act{margin-top:8px}
  .btn{padding:10px;font-size:18px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// 題目依 06-1、06-2 影片字幕出題。秒＝該句在影片中開始的時間;引＝影片原句。
// 題型:單選(第一個選項是正解)、是非、多選、配對、分類、排序。不考聲音的高低變化。
const 片 = {
  聲母:{名:"聲母", 網址:"https://youtu.be/5JMHOlZi5Qw"},
  韻母聲調:{名:"韻母聲調", 網址:"https://youtu.be/cw7MQeBgsFI"}
};
const 關卡 = [
 {id:"聲母", 名:"第 1 關　聲母", 說:"影片：原汁原味牛肉麵", 片:"聲母", 題:[
  {型:"單選", 題:"影片說，四號 z、c、s 是哪一碗麵？", 選:["原汁原味牛肉麵","紅燒牛肉麵","加料牛肉麵","清燉牛肉麵"], 秒:114,
   引:"仙平老師說，四號是「原汁原味牛肉麵」。因為五號、六號，都是在這碗原味的麵上面加料。"},
  {型:"配對", 題:"把號碼配到影片說的料", 對:[["四號（z、c、s）","原味"],["五號","加 i"],["六號","加 h"]], 秒:114,
   引:"四號是「原汁原味牛肉麵」。五號，是在四號後面加上一個 i。六號，是在四號後面加上一個 h。"},
  {型:"單選", 題:"z 加 i、c 加 i、s 加 i，念起來像哪一組注音？", 選:["ㄐ、ㄑ、ㄒ","ㄓ、ㄔ、ㄕ","ㄗ、ㄘ、ㄙ","ㄍ、ㄎ、ㄏ"], 秒:128,
   引:"i 就是「一」的聲音，所以 z 加 i、c 加 i、s 加 i，念起來就像ㄐ、ㄑ、ㄒ。"},
  {型:"是非", 題:"五號這一組（加 i）是一組新的聲母。", 答:false, 秒:140,
   引:"特別說明喔，這一組不屬於聲母，只是原味加了一個 i。"},
  {型:"多選", 題:"選出國小學的注音裡「沒有」的聲母（選兩個）", 選:["v","b","ng","f","h"], 答:[0,2], 秒:81,
   引:"還有兩個，是我們國小學的注音裡沒有的。……v 和 ng，是注音沒有的兩個。"},
  {型:"單選", 題:"影片用什麼情境說明 ng 的念法？", 選:["說「嗯，不要」時開頭那個「嗯」","念英文的 n","念英文的 v","念注音的ㄏ"], 秒:95,
   引:"第二個是 ng，就像同學約你去逛街，你說「嗯，不要」，開頭那個「嗯」。"},
  {型:"是非", 題:"六號是 zh、ch、sh，再加上 rh，對應的注音是ㄓ、ㄔ、ㄕ、ㄖ。", 答:true, 秒:145,
   引:"六號，是在四號後面加上一個 h。zh、ch、sh，再加上 rh，就是ㄓ、ㄔ、ㄕ、ㄖ。"}
 ]},
 {id:"韻母", 名:"第 2 關　韻母", 說:"影片：韻母＋聲調（前半）", 片:"韻母聲調", 題:[
  {型:"多選", 題:"請日本朋友來幫忙的，是哪五個單韻母？（選五個）", 選:["a","i","u","e","o","ii","er"], 答:[0,1,2,3,4], 秒:31,
   引:"仙平老師說，學這五個，就請日本朋友來幫忙。日本人念母音，就是 a、i、u、e、o。"},
  {型:"配對", 題:"把韻母配到影片說的特色", 對:[["ii","只能接在四號 z、c、s 後面"],["er","只用在「仔」"],["a、i、u、e、o","請日本朋友來幫忙"]], 秒:71,
   引:"ii 有一個特性：它只能跟四號做朋友。最後一個是 er，它只用在一個地方：「仔」。"},
  {型:"單選", 題:"ii 的聲音，影片拿什麼來比喻？", 選:["點沖天炮時，引線燒起來快要爆炸的聲音","念兩個ㄧ連在一起","打噴嚏的聲音","火車進站的聲音"], 秒:60,
   引:"注意喔，一個 i 念ㄧ，兩個 i 可不是念「ㄧㄧ」。它的聲音，就像點沖天炮的時候，引線燒起來、快要爆炸的那個聲音。"},
  {型:"是非", 題:"「仔」（er）要念得又長又重才好聽。", 答:false, 秒:104,
   引:"這個「仔」不能念得又長又重，不然很不好聽。要念得短短的，輕輕碰一下就好。"},
  {型:"分類", 題:"這三個字的韻母，結尾各是哪一類？", 類:["元音收尾","鼻音收尾","塞音收尾"], 物:[["晒",0],["三",1],["穀",2]], 秒:131,
   引:"第一類是元音收尾，像「晒」。第二類是鼻音收尾，像「三」。第三類是塞音收尾，像「穀」。"},
  {型:"單選", 題:"海陸腔的單韻母一共有幾個？", 選:["七個","五個","六個","九個"], 秒:17, 引:"海陸腔的單韻母一共有七個。a、i、u、e、o、ii、er。"},
  {型:"是非", 題:"如果看到 ii 接在 b、p、m、f 後面，那是寫錯了，根本沒有這個字。", 答:true, 秒:81,
   引:"所以 ii 只會接在 z、c、s（ㄗㄘㄙ）的後面。如果看到 ii 接在別的聲母後面，那就是寫錯了，根本沒有這個字。"},
  {型:"是非", 題:"兩個以上的單韻母合起來，就叫做結合韻。", 答:true, 秒:122, 引:"兩個以上的單韻母合起來，就叫做結合韻。"}
 ]},
 {id:"聲調", 名:"第 3 關　聲調", 說:"影片：韻母＋聲調（後半）", 片:"韻母聲調", 題:[
  {型:"排序", 題:"把口訣的七個字，依序點出來", 序:["三","嫂","晒","穀","毋","盡","力"], 秒:164,
   引:"海陸腔有七個聲調，口訣是：三嫂晒穀毋盡力。七個字剛好就是七個聲調。"},
  {型:"單選", 題:"海陸腔有幾個聲調？", 選:["七個","四個","五個","六個"], 秒:164, 引:"海陸腔有七個聲調，口訣是：三嫂晒穀毋盡力。"},
  {型:"配對", 題:"口訣裡的字，各是幾聲？", 對:[["穀","一聲"],["嫂","二聲"],["晒","三聲"],["力","四聲"]], 秒:180,
   引:"一聲，穀。二聲，嫂。三聲，晒。四聲，力。"},
  {型:"多選", 必考:true, 題:"仙平老師的記法，最後真正被拿掉的長音是哪兩個？（選兩個）", 選:["穀","嫂","晒","毋","盡","力","三"], 答:[3,6], 秒:214,
   引:"拿掉毋、盡、三這三個長音，最後留下一、二、三、四聲。不過，三聲長音「盡」要敗部復活。"},
  {型:"單選", 必考:true, 題:"學習時的「四加一」，多出來敗部復活的那一個是哪個字？", 選:["盡（三聲長音，中平調）","毋","三","力"], 秒:231,
   引:"不過，三聲長音「盡」要敗部復活。……所以學習的時候，聲調是四加一。一、二、三、四聲，再加上一個中平調。"},
  {型:"是非", 題:"影片說，海陸腔真的只有四個聲調。", 答:false, 秒:226,
   引:"提醒你，這是學習用的濃縮記法，不是說海陸腔只有四個聲調。"},
  {型:"是非", 題:"口訣「三嫂晒穀毋盡力」的意思，是三嫂晒穀的時候偷懶、不認真。", 答:true, 秒:169,
   引:"意思是三嫂晒穀的時候偷懶，不認真。"},
  {型:"是非", 題:"「盡」念起來，就像三聲往後延伸，所以叫做三聲長音。", 答:true, 秒:239,
   引:"它念起來，就像三聲往後延伸，所以叫做三聲長音。"}
 ]}
];
const 魔王 = {id:"魔王", 名:"拼音後測", 說:"聲母、韻母、聲調混合 15 題"};
// 成績記錄:填入 Apps Script 網頁應用程式網址後,首頁會出現「學校（下拉選單）＋名字」欄,測驗結束把分數送進老師的試算表(只寫入,不會把名單傳回網頁)。空白＝不記錄。
const 成績網址 = "https://script.google.com/macros/s/AKfycbx2bg04ky2v-YNvdEYgkvmQVAZlGnpZDQjyqMbFQtPqGPjy7MOD6q9J_pzCW8PCkauSsQ/exec";
// 學校名單取自教師「客語授課課程清單」總表的欄位標題(2026-11-12),都是 4 字簡稱;不在名單內的選「其他學校」自行輸入(最多 4 字)。
const 學校名單 = ["誠正國中","金湖國中","石光國中","岡山國中","鼓山高中","屏實高中","木柵高工","興大附農","復興高中","北士商","景興國中","烏日國中","內湖國中","竹崎高中","武陵高中","陽明高中","尖石國中","振聲中學","興福國中","新屋高中"];
let 學校 = "", 姓名 = "";
const 型名 = {單選:"單選題",是非:"對錯題",多選:"多選題",配對:"配對題",分類:"分類題",排序:"排序題"};

const app = document.getElementById("app");
const 時間 = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
const 洗牌 = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const 連結 = q => `<a href="${片[q.片].網址}?t=${q.秒}" target="_blank" rel="noopener">${片[q.片].名}影片 ${時間(q.秒)}</a>`;
function 讀(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function 存(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function 正解文(q){
  switch(q.型){
    case "單選": return q.選[0];
    case "是非": return q.答 ? "對，影片是這樣說的" : "錯，影片不是這樣說";
    case "多選": return q.答.map(i=>q.選[i]).join("、");
    case "配對": return q.對.map(p=>p[0]+" → "+p[1]).join("；");
    case "分類": return q.物.map(p=>p[0]+" → "+q.類[p[1]]).join("；");
    case "排序": return q.序.join(" → ");
  }
}

let 這關, 題組, 位, 結果, 已答;

function 首頁(){
  document.body.classList.remove("boss");
  const bm = 讀("最高-魔王");
  app.innerHTML = `<div class="center">
    <h1>🍜 牛肉麵攤營業中</h1>
    <p>聲母、韻母、聲調的影片看完了。<br>你是店員，影片裡講過的重點，接得住嗎？<br>答錯要先看影片重點，才能做下一題。</p>
    ${成績網址?`<div class="who">
      <p class="small">請選學校、輸入名字，成績會記錄給老師。考不好沒關係，可以重考刷新分數。</p>
      <select id="sch" class="sid"><option value="">請選學校</option>${學校名單.map(s=>`<option${s===學校?" selected":""}>${s}</option>`).join("")}<option value="其他">其他學校</option></select>
      <input id="sch2" class="sid" maxlength="4" placeholder="學校（最多 4 個字）" style="display:none" autocomplete="off">
      <input id="nm" class="sid" maxlength="8" placeholder="名字" value="${姓名}" autocomplete="off">
      <p class="hint" id="hint"></p></div>`:""}
    <div class="lv">
      <button class="bossbtn" data-id="魔王"><span><b>開始測驗</b><small>${魔王.說}</small></span>${bm?`<em>最高 ${bm}/15</em>`:""}</button>
    </div></div>`;
  const sch = document.getElementById("sch");
  if(sch) sch.onchange = ()=>{ document.getElementById("sch2").style.display = sch.value==="其他" ? "" : "none"; };
  app.querySelectorAll(".lv button").forEach(b=> b.onclick=()=>{
    if(sch){
      const 其他 = sch.value==="其他";
      學校 = (其他 ? document.getElementById("sch2").value : sch.value).replace(/[^一-鿿A-Za-z0-9]/g,"").slice(0,4);
      姓名 = document.getElementById("nm").value.replace(/[^一-鿿A-Za-z·]/g,"").slice(0,8);
      if(!學校 || !姓名){
        document.getElementById("hint").textContent = !學校 && !姓名 ? "請先選學校、輸入名字，才能開始測驗。" : (!學校 ? "請選學校（或選「其他學校」自己輸入）。" : "請輸入名字。");
        return;
      }
    }
    開玩(b.dataset.id);
  });
}

function 開玩(id){
  if(id==="魔王"){
    這關 = 魔王; document.body.classList.add("boss");
    const 全 = []; 關卡.forEach(g=>g.題.forEach(q=>全.push(Object.assign({片:g.片},q))));
    const 必 = 全.filter(q=>q.必考), 餘 = 洗牌(全.filter(q=>!q.必考));
    題組 = 洗牌(必.concat(餘.slice(0,15-必.length)));
  } else {
    這關 = 關卡.find(g=>g.id===id); document.body.classList.remove("boss");
    題組 = 洗牌(這關.題.map(q=>Object.assign({片:這關.片},q)));
  }
  位 = 0; 結果 = []; 出題();
}

function 出題(){
  已答 = false;
  const q = 題組[位];
  const 點 = 題組.map((_,i)=> `<i class="${i<結果.length ? (結果[i].對?"ok":"bad") : (i===位?"now":"")}"></i>`).join("");
  app.innerHTML = `<div class="top"><span>${這關.名}　${位+1} / ${題組.length}</span><span class="dots">${點}</span></div>
    <div><span class="tag">${型名[q.型]}</span></div>
    <div class="stem">${q.題}</div><div id="area"></div><div class="act" id="act"></div><div id="fb"></div>`;
  建[q.型](q, document.getElementById("area"), document.getElementById("act"));
}

// 交卷:顯示對錯、影片原句、連結與緊貼的下一題按鈕
function 交(q, ok){
  if(已答) return; 已答 = true;
  結果.push({q,對:ok});
  document.getElementById("act").innerHTML = "";
  const 末 = 位===題組.length-1;
  const fb = document.getElementById("fb"); fb.className = "fb";
  fb.innerHTML = `<p class="verdict ${ok?"ok":"bad"}">${ok?"✔ 著咧！":"✘ 再看一下綠色个"}</p>
    ${(q.型==="單選"||q.型==="是非") ? "" : `<p class="ans">正確答案：${正解文(q)}</p>`}
    <p class="why">影片原句：${q.引}</p>
    <p class="src">${連結(q)}</p>
    <button class="btn" id="nx">${末?"看結果":"下一題"}</button>`;
  const nx = document.getElementById("nx");
  nx.onclick=()=>{ 位++; 末?結算():出題(); };
  // 答錯：要先點影片連結、等影片重點看完（10 秒）才能按下一題
  if(!ok){
    nx.disabled = true; nx.textContent = "請先點上面的影片連結，看完再按";
    let 開過 = false;
    fb.querySelector(".src a").addEventListener("click", ()=>{
      if(開過) return; 開過 = true;
      let n = 10; nx.textContent = `看完影片重點才能按（${n}）`;
      const t = setInterval(()=>{
        n--;
        if(n<=0){ clearInterval(t); nx.disabled = false; nx.textContent = 末?"看結果":"下一題"; }
        else nx.textContent = `看完影片重點才能按（${n}）`;
      }, 1000);
    });
  }
}
function 確定鈕(act, 可交, 評分){
  const b = document.createElement("button"); b.className="btn"; b.textContent="確定"; b.disabled=true;
  act.appendChild(b);
  b.onclick=()=>{ 評分(); };
  return ()=>{ b.disabled = !可交(); };
}

const 建 = {
  單選(q,area){
    area.className="opts";
    const 選項 = 洗牌(q.選.map((t,i)=>({t,對:i===0})));
    選項.forEach(o=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
      b.onclick=()=>{
        if(已答) return;
        [...area.children].forEach((x,i)=>{ x.disabled=true; if(選項[i].對) x.classList.add("ok"); });
        if(!o.對) b.classList.add("bad");
        交(q,o.對);
      };
      area.appendChild(b);
    });
  },
  是非(q,area){
    area.className="opts g2";
    const 項 = [{t:"✔ 對",v:true},{t:"✘ 錯",v:false}];
    項.forEach(o=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
      b.onclick=()=>{
        if(已答) return;
        [...area.children].forEach((x,i)=>{ x.disabled=true; if(項[i].v===q.答) x.classList.add("ok"); });
        if(o.v!==q.答) b.classList.add("bad");
        交(q,o.v===q.答);
      };
      area.appendChild(b);
    });
  },
  多選(q,area,act){
    area.className="opts g2";
    const 選項 = 洗牌(q.選.map((t,i)=>({t,對:q.答.includes(i),選:false})));
    let 更新;
    const 按 = [];
    選項.forEach(o=>{
      const b=document.createElement("button"); b.className="opt"; b.textContent=o.t;
      b.onclick=()=>{ if(已答) return; o.選=!o.選; b.classList.toggle("sel",o.選); 更新(); };
      area.appendChild(b); 按.push(b);
    });
    更新 = 確定鈕(act, ()=>選項.some(o=>o.選), ()=>{
      let ok = true;
      選項.forEach((o,i)=>{ 按[i].disabled=true; 按[i].classList.remove("sel");
        if(o.對) 按[i].classList.add("ok"); else if(o.選) 按[i].classList.add("bad");
        if(o.對!==o.選) ok=false; });
      交(q,ok);
    });
  },
  配對(q,area,act){
    area.className="rows";
    const 右 = 洗牌(q.對.map(p=>p[1]));
    const 列 = [];
    q.對.forEach(p=>{
      const r=document.createElement("div"); r.className="row";
      const s=document.createElement("select");
      s.innerHTML = `<option value="">選…</option>`+右.map(t=>`<option>${t}</option>`).join("");
      r.innerHTML=`<span>${p[0]}</span>`; r.appendChild(s); area.appendChild(r); 列.push({r,s,p});
    });
    let 更新;
    列.forEach(x=>x.s.onchange=()=>更新());
    更新 = 確定鈕(act, ()=>列.every(x=>x.s.value), ()=>{
      let ok=true;
      列.forEach(x=>{ x.s.disabled=true; const g=x.s.value===x.p[1]; x.r.classList.add(g?"ok":"bad"); if(!g) ok=false; });
      交(q,ok);
    });
  },
  分類(q,area,act){
    area.className="rows";
    const 列 = [];
    q.物.forEach(p=>{
      const r=document.createElement("div"); r.className="row";
      r.innerHTML=`<span>${p[0]}</span>`;
      const seg=document.createElement("div"); seg.className="seg";
      const x={r,p,選:-1,按:[]};
      q.類.forEach((c,ci)=>{
        const b=document.createElement("button"); b.textContent=c;
        b.onclick=()=>{ if(已答) return; x.選=ci; x.按.forEach((y,yi)=>y.classList.toggle("sel",yi===ci)); 更新(); };
        seg.appendChild(b); x.按.push(b);
      });
      r.appendChild(seg); area.appendChild(r); 列.push(x);
    });
    let 更新;
    更新 = 確定鈕(act, ()=>列.every(x=>x.選>=0), ()=>{
      let ok=true;
      列.forEach(x=>{ x.按.forEach(b=>b.disabled=true); const g=x.選===x.p[1]; x.r.classList.add(g?"ok":"bad"); if(!g) ok=false; });
      交(q,ok);
    });
  },
  排序(q,area,act){
    area.innerHTML = `<div class="slots" id="ans"></div><div class="pool" id="pool"></div>`;
    const ans = area.querySelector("#ans"), pool = area.querySelector("#pool");
    let 池 = 洗牌(q.序.map((t,i)=>({t,i}))), 答 = [], 更新;
    function 畫(){
      ans.innerHTML = 答.length ? "" : `<small>點下面的字，依序放進來</small>`;
      答.forEach(o=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=o.t;
        b.onclick=()=>{ if(已答) return; 答=答.filter(x=>x!==o); 池.push(o); 畫(); }; ans.appendChild(b); });
      pool.innerHTML="";
      池.forEach(o=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=o.t;
        b.onclick=()=>{ if(已答) return; 池=池.filter(x=>x!==o); 答.push(o); 畫(); }; pool.appendChild(b); });
      更新 && 更新();
    }
    更新 = 確定鈕(act, ()=>池.length===0, ()=>{
      const ok = 答.every((o,i)=>o.i===i);
      ans.classList.add(ok?"ok":"bad");
      [...ans.children, ...pool.children].forEach(b=>b.disabled=true);
      交(q,ok);
    });
    畫();
  }
};

// 把分數送進老師的試算表。只送出學校、名字、分數、答錯題目的前幾個字;網頁收到的只有「成功與否」。
function 送成績(對, 總, 錯){
  const el = document.getElementById("send"); if(!el) return;
  el.className = "sendmsg"; el.textContent = "成績送出中…";
  const 錯題 = 錯.slice(0,12).map(r=>r.q.題.replace(/[\s（）()？「」，。、：]/g,"").slice(0,10)).join("｜");
  const u = 成績網址+"?action=add&school="+encodeURIComponent(學校)+"&name="+encodeURIComponent(姓名)+"&score="+對+"&total="+總+"&wrong="+encodeURIComponent(錯題);
  fetch(u).then(r=>r.json()).then(j=>{
    if(!j||!j.ok) throw new Error("fail");
    el.className = "sendmsg ok"; el.textContent = "✔ "+學校+" "+姓名+" 的成績已記錄給老師";
  }).catch(()=>{
    el.innerHTML = `✘ 成績沒有送出成功。請確認網路後按「再送一次」，仍不行就截圖這個畫面給老師。 <button class="mini" id="rs">再送一次</button>`;
    document.getElementById("rs").onclick = ()=>送成績(對, 總, 錯);
  });
}

function 結算(){
  const 對 = 結果.filter(r=>r.對).length, 錯 = 結果.filter(r=>!r.對), 總 = 結果.length;
  const 舊 = parseInt(讀("最高-"+這關.id)||"0",10);
  if(對>舊) 存("最高-"+這關.id, String(對));
  const 話 = 對===總 ? "全對！影片你都聽進去了。" : 對>=總-2 ? "很接近了，看一下錯的地方。" : "再看一次影片，重點就會記住。";
  app.innerHTML = `<div class="center">
    <div class="score">${對} / ${總}</div><p>${話}</p>
    ${學校&&姓名&&成績網址?`<p class="sendmsg" id="send"></p>`:""}
    ${錯.length?`<div class="review">${錯.map(r=>`<div>${r.q.題}<br><b>${正解文(r.q)}</b>　${連結(r.q)}</div>`).join("")}</div>`:""}
    <button class="btn" id="again">再考一次</button></div>`;
  document.getElementById("again").onclick=()=>開玩(這關.id);
  if(學校 && 姓名 && 成績網址) 送成績(對, 總, 錯);
}
